<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="title description">
  <title id="title">A production system with an explicit recovery path</title>
  <desc id="description">An ASCII-inspired system routes a request through a queue, agent, state, and trace. A fault triggers a bounded retry before the system recovers while human judgment remains outside the model boundary.</desc>

  <style>
    :root {
      color-scheme: light dark;
      --bg: oklch(0.985 0 0);
      --surface: oklch(0.955 0.012 113);
      --ink: oklch(0.205 0.018 113);
      --muted: oklch(0.46 0.025 113);
      --line: oklch(0.77 0.025 113);
      --primary: oklch(0.52 0.16 113);
      --primary-soft: oklch(0.91 0.08 113);
      --failure: oklch(0.58 0.2 30);
    }

    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      fill: var(--ink);
      text-rendering: geometricPrecision;
    }

    .frame { fill: var(--bg); stroke: var(--line); }
    .rule, .connector, .retry-path { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .connector, .retry-path { marker-end: url(#arrow); }
    .node { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .node-label { font-size: 15px; font-weight: 650; text-anchor: middle; }
    .meta { fill: var(--muted); font-size: 12px; }
    .prompt { fill: var(--primary); font-weight: 750; }
    .scope { fill: none; stroke: var(--primary); stroke-width: 1.5; stroke-dasharray: 4 5; }
    .scope-label { fill: var(--primary); font-size: 11px; font-weight: 750; letter-spacing: 0.08em; }
    .retry-label { fill: var(--muted); font-size: 11px; text-anchor: middle; }
    .status { fill: var(--ink); font-size: 13px; font-weight: 650; animation: settle 5s cubic-bezier(0.16, 1, 0.3, 1) 1 both; }
    .status-key { fill: var(--primary); }
    .arrow-shape { fill: var(--line); }

    .flow-token {
      fill: var(--primary);
      filter: url(#primary-glow);
      animation: forward 5s cubic-bezier(0.25, 1, 0.5, 1) 1 both;
    }

    .fault {
      fill: var(--failure);
      animation: fault 5s linear 1 both;
    }

    .retry-token {
      fill: var(--failure);
      filter: url(#failure-glow);
      animation: retry 5s cubic-bezier(0.25, 1, 0.5, 1) 1 both;
    }

    .recovery-token {
      fill: var(--primary);
      filter: url(#primary-glow);
      animation: recover 5s cubic-bezier(0.16, 1, 0.3, 1) 1 both;
    }

    .state-node { animation: state 5s ease-out 1 both; }

    @keyframes forward {
      0%, 5% { opacity: 0; transform: translateX(0); }
      9% { opacity: 1; }
      37% { opacity: 1; transform: translateX(578px); }
      40%, 100% { opacity: 0; transform: translateX(578px); }
    }

    @keyframes fault {
      0%, 35% { opacity: 0; transform: translateY(-3px); }
      39%, 49% { opacity: 1; transform: translateY(0); }
      54%, 100% { opacity: 0; transform: translateY(2px); }
    }

    @keyframes retry {
      0%, 45% { opacity: 0; transform: translate(0, 0); }
      49% { opacity: 1; transform: translate(0, 0); }
      56% { opacity: 1; transform: translate(0, 48px); }
      66% { opacity: 1; transform: translate(-175px, 48px); }
      73% { opacity: 1; transform: translate(-175px, 0); }
      76%, 100% { opacity: 0; transform: translate(-175px, 0); }
    }

    @keyframes recover {
      0%, 70% { opacity: 0; transform: translateX(0); }
      74% { opacity: 1; transform: translateX(0); }
      89% { opacity: 1; transform: translateX(350px); }
      93%, 100% { opacity: 0; transform: translateX(350px); }
    }

    @keyframes state {
      0%, 34%, 56%, 100% { stroke: var(--line); fill: var(--surface); }
      39%, 49% { stroke: var(--failure); fill: var(--surface); }
      72%, 90% { stroke: var(--primary); fill: var(--primary-soft); }
    }

    @keyframes settle {
      0%, 74% { opacity: 0; transform: translateY(4px); }
      88%, 100% { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: oklch(0.115 0 0);
        --surface: oklch(0.17 0.018 113);
        --ink: oklch(0.93 0.01 113);
        --muted: oklch(0.7 0.025 113);
        --line: oklch(0.35 0.025 113);
        --primary: oklch(0.8 0.17 113);
        --primary-soft: oklch(0.25 0.07 113);
        --failure: oklch(0.72 0.18 30);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .motion, .fault { display: none; }
      .status, .state-node { animation: none; }
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path class="arrow-shape" d="M0 0 L7 3.5 L0 7 Z"/>
    </marker>
    <filter id="primary-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="failure-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect class="frame" x="1" y="1" width="918" height="338" rx="14"/>

  <text x="28" y="38" font-size="14"><tspan class="prompt">$</tspan><tspan> ./ship --with-boundaries</tspan></text>
  <text class="meta" x="892" y="38" text-anchor="end">mode: production</text>
  <path class="rule" d="M28 58 H892"/>

  <rect class="scope" x="383" y="86" width="148" height="116" rx="8"/>
  <text class="scope-label" x="457" y="78" text-anchor="middle">MODEL SCOPE</text>

  <path class="connector" d="M170 145 H216"/>
  <path class="connector" d="M345 145 H391"/>
  <path class="connector" d="M520 145 H566"/>
  <path class="connector" d="M695 145 H741"/>

  <rect class="node" x="42" y="118" width="128" height="54" rx="7"/>
  <rect class="node" x="217" y="118" width="128" height="54" rx="7"/>
  <rect class="node" x="392" y="118" width="128" height="54" rx="7"/>
  <rect class="node state-node" x="567" y="118" width="128" height="54" rx="7"/>
  <rect class="node" x="742" y="118" width="128" height="54" rx="7"/>

  <text class="node-label" x="106" y="151">[ request ]</text>
  <text class="node-label" x="281" y="151">[ queue ]</text>
  <text class="node-label" x="456" y="151">[ agent ]</text>
  <text class="node-label" x="631" y="151">[ state ]</text>
  <text class="node-label" x="806" y="151">[ trace ]</text>

  <path class="retry-path" d="M631 173 V220 H457 V176"/>
  <text class="retry-label" x="544" y="211">retry / replay-safe</text>

  <g class="fault">
    <text x="631" y="103" font-size="11" font-weight="750" text-anchor="middle">FAULT</text>
    <path d="M625 107 L637 107" stroke="currentColor" stroke-width="2"/>
  </g>

  <g class="motion">
    <circle class="flow-token" cx="106" cy="145" r="4.5"/>
    <circle class="retry-token" cx="631" cy="172" r="4.5"/>
    <circle class="recovery-token" cx="456" cy="145" r="4.5"/>
  </g>

  <path class="rule" d="M28 272 H892"/>
  <text class="status" x="28" y="307"><tspan class="status-key">status:</tspan><tspan> recovered  |  model authority: bounded  |  judgment: human</tspan></text>
</svg>
